<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OFELIA · Interior 3D</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121b22;color:#f5f1eb;font:15px Arial,sans-serif}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
    .top{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:14px;pointer-events:none}
    .panel{pointer-events:auto;padding:14px 17px;border-radius:11px;background:rgba(20,30,38,.9);border:1px solid #52616c;backdrop-filter:blur(8px)}
    h1{margin:0 0 6px;font:400 23px Georgia,serif}p{margin:0;color:#c8d3d8;line-height:1.45}
    a{color:#eacaa3}.actions{display:flex;align-items:flex-start;gap:8px}button{background:#263944;border:1px solid #82919b;color:#f5f1eb;border-radius:8px;padding:10px 12px;cursor:pointer;font:inherit}button:hover{background:#3d5664}
    .help{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);padding:11px 16px;border-radius:8px;background:rgba(20,30,38,.9);text-align:center;white-space:nowrap}
    #joystick{display:none;position:fixed;left:22px;bottom:22px;width:112px;height:112px;border-radius:50%;border:2px solid rgba(255,255,255,.65);background:rgba(20,30,38,.45);touch-action:none;align-items:center;justify-content:center}
    #nub{width:48px;height:48px;border-radius:50%;background:#d5b58c;box-shadow:0 2px 10px #0008;pointer-events:none}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#15232d;text-align:center;padding:24px}#loading[hidden]{display:none}
    .loading-card{width:min(450px,100%)}.bar{height:7px;border-radius:7px;background:#40515b;margin:20px 0 10px;overflow:hidden}#fill{height:100%;width:0;background:#d5b58c;transition:width .2s}
    @media(max-width:760px),(pointer:coarse){.top{flex-direction:column}.panel{padding:10px 12px}.panel h1{font-size:19px}.actions{align-self:flex-end}.help{left:auto;right:12px;bottom:28px;transform:none;width:min(42vw,220px);white-space:normal;font-size:13px}#joystick{display:flex}}
  </style>
</head>
<body>
  <canvas id="viewer" aria-label="Recorrido 3D del living y cocina de OFELIA"></canvas>
  <div class="top">
    <div class="panel"><h1>OFELIA · Interior 3D</h1><p>Living y cocina amueblados · renderizado en tu navegador</p><p><a href="./index.html">Volver a los recorridos</a></p></div>
    <div class="panel actions"><button id="living" type="button">Sala</button><button id="kitchen" type="button">Cocina</button></div>
  </div>
  <div class="help">W A S D para caminar · arrastra el ratón para mirar · Shift para acelerar</div>
  <div id="joystick" aria-label="Control táctil para caminar"><div id="nub"></div></div>
  <div id="loading"><div class="loading-card"><h1>Preparando el interior</h1><p id="message">Descargando el departamento…</p><div class="bar"><div id="fill"></div></div><p id="percent">0 %</p></div></div>
  <script type="module" src="./interior.js"></script>
</body>
</html>
